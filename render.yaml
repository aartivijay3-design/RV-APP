services:
  - type: web
    name: bawa-rv-app
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python run_server.py
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_REPO
        sync: false
      - key: GITHUB_BRANCH
        value: main
      - key: TUNNEL_AUTH_USER
        sync: false
      - key: TUNNEL_AUTH_PASS
        sync: false
